name: spike
on:
  workflow_dispatch:   # run: gh workflow run spike -f linux=true -f android=false
    inputs:
      linux: {type: boolean, default: false}
      android: {type: boolean, default: true}
jobs:
  linux:
    if: inputs.linux
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - run: swift run spike          # mock, in-process
      - run: swift run spike --resume spike-checkpoint.json   # new process
  android:
    if: inputs.android
    # Runs the package tests (all scenarios against the in-process mock) on an Android emulator.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: skiptools/swift-android-action@v2
        with:
          swift-version: "6.3"
