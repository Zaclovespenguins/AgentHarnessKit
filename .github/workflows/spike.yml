name: spike
on: [push, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - run: swift run spike          # mock, in-process
      - run: swift run spike --resume spike-checkpoint.json   # new process
  android:
    # Runs the package tests (all scenarios against the in-process mock) on an Android emulator.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: skiptools/swift-android-action@v2
        with:
          swift-version: "6.3"
