name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Official images pinned to the Mintfile versions. They avoid building Mint
      # and the tools on every run. Keep these tags in sync with Mintfile.
      - name: SwiftFormat
        run: |
          docker run --rm -v "$PWD":/work:ro -w /work ghcr.io/nicklockwood/swiftformat:0.60.1 --lint .
      - name: SwiftLint
        run: |
          docker run --rm -v "$PWD":/work:ro -w /work ghcr.io/realm/swiftlint:0.63.0 lint --strict

  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test --parallel -Xswiftc -warnings-as-errors

  linux:
    name: Linux (Swift 6.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # The job runs the swift:6.3 image through docker instead of `container:`
      # because the swift image ships no Node.js, so node-based actions such as
      # actions/checkout cannot run inside it. This is the same command that is
      # verified locally (see ROADMAP Phase 0/8).
      - name: Build and test
        run: |
          docker run --rm -v "$PWD":/src:ro swift:6.3 bash -c '
            cp -r /src /work && cd /work && rm -rf .build &&
            apt-get update -qq && apt-get install -y -qq libsqlite3-dev &&
            swift build -Xswiftc -warnings-as-errors &&
            swift test --parallel -Xswiftc -warnings-as-errors'

  # Live provider tests (LiveEndpointTests) run only when the repository secrets
  # are set. Without AHK_LIVE_BASE_URL every live step is skipped, so forks and
  # PRs without secrets stay green. Secrets are mapped into env here and never
  # interpolated into run scripts; do not echo them.
  live:
    name: Live provider (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-26
          - platform: linux
            runner: ubuntu-latest
          - platform: ios
            runner: macos-26
    env:
      AHK_LIVE_BASE_URL: ${{ secrets.AHK_LIVE_BASE_URL }}
      AHK_LIVE_API_KEY: ${{ secrets.AHK_LIVE_API_KEY }}
      AHK_LIVE_MODEL: ${{ secrets.AHK_LIVE_MODEL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Live tests (macOS)
        if: env.AHK_LIVE_BASE_URL != '' && matrix.platform == 'macos'
        run: swift test --filter LiveEndpointTests -Xswiftc -warnings-as-errors
      # Same docker pattern as the linux job. -e with a bare name forwards the
      # value from the step environment, so no secret text appears in the script.
      - name: Live tests (Linux, Swift 6.3)
        if: env.AHK_LIVE_BASE_URL != '' && matrix.platform == 'linux'
        run: |
          docker run --rm -e AHK_LIVE_BASE_URL -e AHK_LIVE_API_KEY -e AHK_LIVE_MODEL -v "$PWD":/src:ro swift:6.3 bash -c '
            cp -r /src /work && cd /work && rm -rf .build &&
            apt-get update -qq && apt-get install -y -qq libsqlite3-dev &&
            swift test --filter LiveEndpointTests -Xswiftc -warnings-as-errors'
      # xcodebuild forwards TEST_RUNNER_-prefixed variables to the test process
      # with the prefix removed.
      - name: Live tests (iOS Simulator)
        if: env.AHK_LIVE_BASE_URL != '' && matrix.platform == 'ios'
        env:
          TEST_RUNNER_AHK_LIVE_BASE_URL: ${{ env.AHK_LIVE_BASE_URL }}
          TEST_RUNNER_AHK_LIVE_API_KEY: ${{ env.AHK_LIVE_API_KEY }}
          TEST_RUNNER_AHK_LIVE_MODEL: ${{ env.AHK_LIVE_MODEL }}
        run: >-
          xcodebuild test -scheme AgentHarnessKit-Package
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -skipMacroValidation -only-testing:AgentHarnessKitALMTests/LiveEndpointTests

  ios:
    name: iOS Simulator
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # CI cannot click Xcode's macro trust prompt, and the build fails with "Macro
      # AnyLanguageModelMacros must be enabled". Decision (2026-11-17, maintainer):
      # pass -skipMacroValidation. See docs/ARCHITECTURE.md "Macro trust".
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -scheme AgentHarnessKit-Package -destination 'generic/platform=iOS Simulator'
          -skipMacroValidation build
      # Core and ALM mock-server tests must pass on a concrete simulator
      # (ROADMAP Phase 8 definition of done). Live tests are skipped here.
      - name: Test on iOS Simulator
        run: >-
          xcodebuild test -scheme AgentHarnessKit-Package -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -skipMacroValidation -only-testing:AgentHarnessKitTests -only-testing:AgentHarnessKitALMTests
